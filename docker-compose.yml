services:
  wetty-mcp:
    build: .
    ports:
      - "8000"
    volumes:
      - wetty-data:/app/data
      - ./config:/app/config:ro
      - ~/.ssh:/root/.ssh:ro
    environment:
      - PYTHONPATH=/app
      - WETTY_API_TOKEN=${WETTY_API_TOKEN:-}      # 设置后启用 API/MCP 认证，未设置时为开发模式（免认证）
      # - WETTY_ENCRYPTION_KEY=your-fernet-key    # 生产环境设置固定加密密钥
    restart: unless-stopped

volumes:
  wetty-data:
